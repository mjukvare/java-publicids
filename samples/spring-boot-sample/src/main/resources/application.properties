spring.application.name=shop

# PublicIds, shown with their defaults. You only need these lines to change them.
# Install the codec behind the static PublicIds facade (used by Customer.publicId()).
publicids.install=true
# Scan this application's packages for @PublicIdPrefix types at startup, failing fast on invalid or colliding prefixes.
publicids.scan=true
# Resolve @PublicIdPrefix types that weren't scanned or registered on first use.
publicids.annotation-fallback=true
